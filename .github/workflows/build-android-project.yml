name: "CI"

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'ci skip') && (!contains(github.event_name, 'pull_request') || (contains(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository))"
    runs-on: ubuntu-latest
    steps:

    - name: "Checkout: Code"
      uses: actions/checkout@v4

    - name: "Setup: Java"
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: "temurin"

    - name: "Setup: Android SDK"
      uses: android-actions/setup-android@v3

    - name: "Setup: Install Android SDK dependencies"
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

    - name: "Setup: Install additional dependencies"
      run: sudo apt-get install -y ispell

    - name: "Cache: Gradle"
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle
          .gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: "Build: Project with make"
      run: make clean all

    - name: "Build: List dist files"
      if: always()
      run: find dist -type f -maxdepth 2

    - name: "Artifacts: All"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: "all"
        path: dist
        retention-days: 5

    - name: "Artifacts: Android APK"
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: "android-apk"
        path: |
          dist/*.apk
        if-no-files-found: error
